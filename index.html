<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Mr. Wok — Carta</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body {
      touch-action: manipulation;
      font-family: Arial, sans-serif;
    }
    #viewer {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: min(100vw, 177.7777778vh);
      height: min(56.25vw, 100vh);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }
    #slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .hotspot {
      position: absolute;
      z-index: 10;
      cursor: pointer;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      display: block;
    }
    #fullscreen {
      position: fixed;
      right: 10px;
      top: max(10px, env(safe-area-inset-top));
      z-index: 50;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 22px;
    }
    #home {
      position: fixed;
      left: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 50;
      border: 0;
      border-radius: 22px;
      padding: 9px 15px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 13px;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
    }
  
    /* ===== CARTA 2.3 — visual effects only, navigation untouched ===== */
    .hotspot{
      -webkit-tap-highlight-color:transparent;
      outline:none;
      transition:transform .14s ease, filter .14s ease;
    }

    /* Visual feedback is behind the transparent hit area and never receives
       pointer events. It does not change coordinates or navigation. */
    .hotspot::before{
      content:"";
      position:absolute;
      inset:3%;
      border-radius:10px;
      pointer-events:none;
      opacity:0;
      border:1px solid rgba(255,255,255,.20);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -3px 5px rgba(0,0,0,.15),
        0 3px 8px rgba(0,0,0,.12);
      transition:opacity .14s ease;
    }

    .hotspot:hover::before,
    .hotspot:focus-visible::before{
      opacity:.65;
    }

    .hotspot:active,
    .hotspot.is-touching{
      transform:scale(.975);
      filter:brightness(.97);
    }

    .hotspot:active::before{
      opacity:.85;
      box-shadow:
        inset 0 3px 6px rgba(0,0,0,.22),
        inset 0 -1px 0 rgba(255,255,255,.08);
    }

    @media (prefers-reduced-motion:reduce){
      .hotspot{transition:none!important}
      .hotspot::before{transition:none!important}
    }


    /* ===== CARTA 2.4 — RELIEVE VISUAL EN TODOS LOS BOTONES ===== */
    .hotspot{
      -webkit-tap-highlight-color:transparent;
      outline:none;
      border-radius:12px;
      transition:
        transform .13s cubic-bezier(.2,.8,.2,1),
        filter .13s ease,
        box-shadow .13s ease;
      box-shadow:
        0 2px 5px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -2px 4px rgba(0,0,0,.18);
    }

    /* The visual surface never captures pointer/touch events. */
    .hotspot::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      pointer-events:none;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.16) 0%,
          rgba(255,255,255,.04) 38%,
          rgba(0,0,0,.06) 65%,
          rgba(0,0,0,.15) 100%
        );
      border:1px solid rgba(255,255,255,.20);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.20),
        inset 0 -3px 5px rgba(0,0,0,.18);
      opacity:.55;
      transition:opacity .13s ease,box-shadow .13s ease;
    }

    .hotspot::after{
      content:"";
      position:absolute;
      left:8%;
      right:8%;
      bottom:-5px;
      height:6px;
      border-radius:50%;
      pointer-events:none;
      background:rgba(0,0,0,.24);
      filter:blur(3px);
      opacity:.38;
      transition:opacity .13s ease,transform .13s ease;
    }

    .hotspot:hover,
    .hotspot:focus-visible{
      transform:translateY(-2px) scale(1.012);
      filter:brightness(1.05);
      box-shadow:
        0 5px 11px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.24),
        inset 0 -2px 5px rgba(0,0,0,.20);
    }

    .hotspot:hover::before,
    .hotspot:focus-visible::before{
      opacity:.82;
    }

    .hotspot:active,
    .hotspot.is-touching{
      transform:translateY(2px) scale(.97);
      filter:brightness(.96);
      box-shadow:
        0 1px 2px rgba(0,0,0,.25),
        inset 0 3px 7px rgba(0,0,0,.28),
        inset 0 -1px 0 rgba(255,255,255,.10);
    }

    .hotspot:active::before,
    .hotspot.is-touching::before{
      opacity:.92;
      box-shadow:
        inset 0 3px 7px rgba(0,0,0,.28),
        inset 0 -1px 0 rgba(255,255,255,.08);
    }

    .hotspot:active::after,
    .hotspot.is-touching::after{
      opacity:.12;
      transform:scale(.78);
    }

    @media (prefers-reduced-motion:reduce){
      .hotspot,.hotspot::before,.hotspot::after{
        transition:none!important;
      }
    }

</style>

    DATA.external = {

          "x": 54.37007874015748,

          "h": 10.923228346456693,
          "url": "https://maps.app.goo.gl/sn9JC4gLSb1Sx7TDA",
          "name": "Google Maps"
        }
      ]
    };


    const stage = document.getElementById("stage");
    const slide = document.getElementById("slide");
    const loading = document.getElementById("loading");

    let currentSlide = 1;

    function readSlide() {
      const value = Number.parseInt(window.location.hash.substring(1), 10);
      if (Number.isInteger(value) && value >= 1 && value <= DATA.count) {
        return value;
      }
      return 1;
    }

    function goTo(number) {
      const target = Math.max(1, Math.min(DATA.count, number));
      currentSlide = target;
      window.history.replaceState(null, "", "#" + target);
      draw();
    }

    function draw() {
      currentSlide = readSlide();

      document.querySelectorAll(".hotspot").forEach((element) => element.remove());

      slide.src = "slides/" + currentSlide + ".png";

      const links = DATA.links[String(currentSlide)] || [];

      links.forEach((link) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "hotspot";
        button.setAttribute("aria-label", "Ir a página " + link.target);

        button.style.left = link.x + "%";
        button.style.top = link.y + "%";
        button.style.width = link.w + "%";
        button.style.height = link.h + "%";

        button.addEventListener("click", function(event) {
          event.preventDefault();
          event.stopPropagation();
          goTo(link.target);
        });

        stage.appendChild(button);
      });

      const externalLinks = DATA.external[String(currentSlide)] || [];

      externalLinks.forEach((link) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "hotspot";
        button.setAttribute("aria-label", link.name || "Abrir enlace");

        button.style.left = link.x + "%";
        button.style.top = link.y + "%";
        button.style.width = link.w + "%";
        button.style.height = link.h + "%";

        button.addEventListener("click", function(event) {
          event.preventDefault();
          event.stopPropagation();
          window.location.href = link.url;
        });

        stage.appendChild(button);
      });
    }

    slide.addEventListener("load", function() {
      loading.style.display = "none";
    });

    window.addEventListener("hashchange", draw);

    document.getElementById("home").addEventListener("click", function() {
      goTo(1);
    });

    document.getElementById("fullscreen").addEventListener("click", async function() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        // Algunos móviles no permiten fullscreen desde el navegador.
      }
    });

    // Deslizar también permite cambiar de página.
    let startX = 0;
    let startY = 0;

    stage.addEventListener("touchstart", function(event) {
      const touch = event.changedTouches[0];
      startX = touch.clientX;
      startY = touch.clientY;
    }, { passive: true });

    stage.addEventListener("touchend", function(event) {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;

      if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy)) {
        goTo(currentSlide + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    currentSlide = readSlide();
    draw();
  
    document.addEventListener("touchstart", function(event){
      const target = event.target.closest(".hotspot, #home, #fs");
      if (target) target.classList.add("is-touching");
    }, {passive:true});

    document.addEventListener("touchend", function(){
      document.querySelectorAll(".is-touching").forEach(function(el){
        el.classList.remove("is-touching");
      });
    }, {passive:true});

    document.addEventListener("touchcancel", function(){
      document.querySelectorAll(".is-touching").forEach(function(el){
        el.classList.remove("is-touching");
      });
    }, {passive:true});
