<html lang="es">

<title>Mr. Wok — Carta</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{touch-action:manipulation}
#viewer{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,177.7777778vh);height:min(56.25vw,100vh);aspect-ratio:16/9;overflow:hidden}
#slide{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;z-index:20;display:block;background:transparent;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
#loading{position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font:16px system-ui}
#fs{position:fixed;z-index:40;right:10px;top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:22px}
#home{position:fixed;z-index:40;left:10px;bottom:max(10px,env(safe-area-inset-bottom));padding:9px 14px;border:0;border-radius:22px;background:rgba(0,0,0,.55);color:#fff;font:13px system-ui}
</style>
</head>
<body>
<div id="loading">Cargando carta…</div>
<div id="viewer">
  <div id="stage"><img id="slide" alt="Carta Mr. Wok" draggable="false"></div>
</div>
<button id="fs" aria-label="Pantalla completa">⛶</button>
<button id="home" aria-label="Inicio">Inicio</button>

const stage=document.getElementById('stage');
const img=document.getElementById('slide');
const loading=document.getElementById('loading');
let n=1;

function getN(){
 const v=parseInt(location.hash.slice(1),10);
 return Number.isFinite(v)&&v>=1&&v<=14?v:1;
}
function go(target){
 if(target>=1&&target<=14){
   n=target;
   history.replaceState(null,'','#'+n);
   render();
 }
}
function render(){
 n=getN();
 stage.querySelectorAll('.nav').forEach(e=>e.remove());
 img.src='slides/'+n+'.png';
 (LINKS[n]||[]).forEach(z=>{
   const b=document.createElement('button');
   b.className='nav';
   b.type='button';
   b.style.left=z.x+'%'; b.style.top=z.y+'%';
   b.style.width=z.w+'%'; b.style.height=z.h+'%';
   b.setAttribute('aria-label', z.target ? 'Ir a página '+z.target : 'Abrir enlace');
   b.addEventListener('click',e=>{
      e.preventDefault(); e.stopPropagation();
      if(z.target) go(z.target);
      else if(z.url) window.location.href=z.url;
   });
   stage.appendChild(b);
 });
}
img.onload=()=>loading.style.display='none';
window.addEventListener('hashchange',render);
document.getElementById('home').onclick=()=>go(1);
document.getElementById('fs').onclick=async()=>{
 try{
  if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
 }catch(e){}
};
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)) go(n+(dx<0?1:-1));
},{passive:true});
render();
</script>
