<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Mr. Wok — Carta</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body {
      touch-action: manipulation;
      font-family: Arial, sans-serif;
    }
    #viewer {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: min(100vw, 177.7777778vh);
      height: min(56.25vw, 100vh);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }
    #slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .hotspot {
      position: absolute;
      z-index: 10;
      cursor: pointer;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      display: block;
    }
    #fullscreen {
      position: fixed;
      right: 10px;
      top: max(10px, env(safe-area-inset-top));
      z-index: 50;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 22px;
    }
    #home {
      position: fixed;
      left: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 50;
      border: 0;
      border-radius: 22px;
      padding: 9px 15px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 13px;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
    }
  
    /* --- MR. WOK PREMIUM UI --- */
    #slide{
      opacity:1;
      transform:scale(1);
      transition:opacity .34s ease, transform .34s cubic-bezier(.2,.75,.25,1);
      will-change:opacity,transform;
    }
    #slide.fade-out{
      opacity:0;
      transform:scale(1.018);
    }
    .hotspot{
      border-radius:12px;
      transition:transform .16s ease, filter .16s ease, box-shadow .16s ease;
      outline:none;
    }
    .hotspot::after{
      content:"";
      position:absolute;
      inset:2%;
      border-radius:inherit;
      box-shadow:inset 0 2px 0 rgba(255,255,255,.18), inset 0 -3px 7px rgba(0,0,0,.25);
      opacity:0;
      transition:opacity .16s ease;
      pointer-events:none;
    }
    .hotspot:hover,.hotspot:focus-visible{
      transform:translateY(-2px) scale(1.012);
      filter:brightness(1.06) drop-shadow(0 5px 8px rgba(0,0,0,.22));
    }
    .hotspot:hover::after,.hotspot:focus-visible::after{opacity:1}
    .hotspot:active{
      transform:translateY(2px) scale(.965);
      filter:brightness(.96) drop-shadow(0 1px 2px rgba(0,0,0,.28));
      transition-duration:.07s;
    }
    #fs,#home{
      border:1px solid rgba(255,255,255,.16)!important;
      background:linear-gradient(180deg,rgba(70,70,70,.88),rgba(12,12,12,.92))!important;
      box-shadow:0 5px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -3px 6px rgba(0,0,0,.45);
      text-shadow:0 1px 2px #000;
      transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;
    }
    #fs:hover,#home:hover{filter:brightness(1.12);transform:translateY(-2px)}
    #fs:active,#home:active{transform:translateY(2px) scale(.97)}
    @media (prefers-reduced-motion: reduce){
      #slide,.hotspot,#fs,#home{transition:none!important}
    }


    /* ===== CARTA 2.1 PREMIUM ===== */
    #viewer{
      perspective:1200px;
    }

    #stage{
      box-shadow:
        0 22px 65px rgba(0,0,0,.58),
        0 3px 18px rgba(0,0,0,.35);
      isolation:isolate;
    }

    #stage::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:7;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.055), transparent 42%),
        linear-gradient(120deg, rgba(255,255,255,.035), transparent 30%, rgba(0,0,0,.025) 70%, transparent);
      opacity:.9;
    }

    #slide{
      transform-origin:center center;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    #slide.fade-out{
      opacity:0;
      transform:scale(1.025);
    }

    .hotspot{
      -webkit-touch-callout:none;
      -webkit-user-select:none;
      user-select:none;
      will-change:transform,filter;
    }

    .hotspot::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:linear-gradient(
        145deg,
        rgba(255,255,255,.13),
        transparent 32%,
        rgba(0,0,0,.08)
      );
      opacity:0;
      transition:opacity .18s ease;
      pointer-events:none;
    }

    .hotspot:hover::before,
    .hotspot:focus-visible::before{
      opacity:1;
    }

    .hotspot:active{
      transform:translateY(2px) scale(.96);
    }

    #fs,#home{
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
    }

    #fs{
      overflow:hidden;
    }

    #fs::after,
    #home::after{
      content:"";
      position:absolute;
      left:-80%;
      top:0;
      width:55%;
      height:100%;
      transform:skewX(-20deg);
      background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.16),
        transparent
      );
      transition:left .45s ease;
      pointer-events:none;
    }

    #fs:hover::after,
    #home:hover::after{
      left:140%;
    }

    #home,#fs{
      position:fixed;
      overflow:hidden;
    }

    @keyframes premiumAppear{
      from{opacity:0;transform:scale(.985)}
      to{opacity:1;transform:scale(1)}
    }

    #stage{
      animation:premiumAppear .45s ease-out both;
    }

    @media (prefers-reduced-motion: reduce){
      #stage{animation:none!important}
      #slide,.hotspot,#fs,#home{transition:none!important}
    }

</style>

          "h": 10.923228346456693,

    };


    const stage = document.getElementById("stage");
    const slide = document.getElementById("slide");
    const loading = document.getElementById("loading");

    let currentSlide = 1;

    function readSlide() {
      const value = Number.parseInt(window.location.hash.substring(1), 10);
      if (Number.isInteger(value) && value >= 1 && value <= DATA.count) {
        return value;
      }
      return 1;
    }

    function goTo(number) {
      const target = Math.max(1, Math.min(DATA.count, number));
      currentSlide = target;
      window.history.replaceState(null, "", "#" + target);
      draw();
    }

    function draw() {
      currentSlide = readSlide();

      document.querySelectorAll(".hotspot").forEach((element) => element.remove());

      if (animate) slide.classList.add("fade-out");

      slide.src = "slides/" + currentSlide + ".png";

      const links = DATA.links[String(currentSlide)] || [];

      links.forEach((link) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "hotspot";
        button.setAttribute("aria-label", "Ir a página " + link.target);

        button.style.left = link.x + "%";
        button.style.top = link.y + "%";
        button.style.width = link.w + "%";
        button.style.height = link.h + "%";

        button.addEventListener("click", function(event) {
          event.preventDefault();
          event.stopPropagation();
          goTo(link.target);
        });

        stage.appendChild(button);
      });

      const externalLinks = DATA.external[String(currentSlide)] || [];

      externalLinks.forEach((link) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "hotspot";
        button.setAttribute("aria-label", link.name || "Abrir enlace");

        button.style.left = link.x + "%";
        button.style.top = link.y + "%";
        button.style.width = link.w + "%";
        button.style.height = link.h + "%";

        button.addEventListener("click", function(event) {
          event.preventDefault();
          event.stopPropagation();
          window.location.href = link.url;
        });

        stage.appendChild(button);
      });
    }

    slide.addEventListener("load", function() {
      loading.style.display = "none";
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          slide.classList.remove("fade-out");
        });
      });
    });

    window.addEventListener("hashchange", draw);

    document.getElementById("home").addEventListener("click", function() {
      goTo(1);
    });

    document.getElementById("fullscreen").addEventListener("click", async function() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        // Algunos móviles no permiten fullscreen desde el navegador.
      }
    });

    // Deslizar también permite cambiar de página.
    let startX = 0;
    let startY = 0;

    stage.addEventListener("touchstart", function(event) {
      const touch = event.changedTouches[0];
      startX = touch.clientX;
      startY = touch.clientY;
    }, { passive: true });

    stage.addEventListener("touchend", function(event) {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;

      if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy)) {
        goTo(currentSlide + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    currentSlide = readSlide();
    draw();
  
    // CARTA 2.1: keep touch feedback responsive on mobile.
    document.addEventListener("touchstart", function(event) {
      const target = event.target.closest(".hotspot, #home, #fs");
      if (target) target.classList.add("is-touching");
    }, {passive:true});

    document.addEventListener("touchend", function() {
      document.querySelectorAll(".is-touching").forEach(function(el) {
        el.classList.remove("is-touching");
      });
    }, {passive:true});
